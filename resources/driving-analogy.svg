<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dTitle dDesc">
  <title id="dTitle">Manual, then automatic, then HEV auto-hold, then one-pedal</title>
  <desc id="dDesc">A four-stage illustration: manual transmission, automatic transmission, HEV auto-hold braking, and one-pedal driving, each stage building on the mental model of the one before it.</desc>
  <style>
    :root {
      --bg: #faf8f3;
      --ink: #2b271f;
      --ink-dim: #6b6455;
      --line: #d8d0bf;
      --gold: #a6741f;
      --gold-soft: #a6741f22;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e1116;
        --ink: #e8e1cf;
        --ink-dim: #8791a1;
        --line: #2b3340;
        --gold: #d9a441;
        --gold-soft: #d9a44122;
      }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
    .stage-num { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; fill: var(--gold); letter-spacing: 0.06em; }
    .stage-name { font-size: 16px; font-weight: 600; fill: var(--ink); }
    .stage-note { font-size: 12.5px; fill: var(--ink-dim); }
    .path-line { stroke: var(--line); stroke-width: 2; fill: none; }
    .node-ring { fill: var(--bg); stroke: var(--gold); stroke-width: 2.5; }
    .tie-back { font-size: 13px; fill: var(--ink-dim); }
    .tie-back .hi { fill: var(--gold); font-weight: 600; }
  </style>

  <rect x="0" y="0" width="900" height="400" fill="var(--bg)"></rect>

  <path class="path-line" d="M100,244 C 210,244 220,184 330,184 S 450,134 560,134 S 680,94 790,94"></path>

  <circle class="node-ring" cx="100" cy="244" r="9"></circle>
  <text class="stage-num" x="100" y="286" text-anchor="middle">01</text>
  <text class="stage-name" x="100" y="212" text-anchor="middle">Manual</text>
  <text class="stage-note" x="100" y="303" text-anchor="middle">learn where the</text>
  <text class="stage-note" x="100" y="319" text-anchor="middle">gears actually live</text>

  <circle class="node-ring" cx="330" cy="184" r="9"></circle>
  <text class="stage-num" x="330" y="226" text-anchor="middle">02</text>
  <text class="stage-name" x="330" y="152" text-anchor="middle">Automatic</text>
  <text class="stage-note" x="330" y="243" text-anchor="middle">release, reapply —</text>
  <text class="stage-note" x="330" y="259" text-anchor="middle">faster shifts, same idea</text>

  <circle class="node-ring" cx="560" cy="134" r="9"></circle>
  <text class="stage-num" x="560" y="176" text-anchor="middle">03</text>
  <text class="stage-name" x="560" y="102" text-anchor="middle">HEV auto-hold</text>
  <text class="stage-note" x="560" y="193" text-anchor="middle">the brake just...</text>
  <text class="stage-note" x="560" y="209" text-anchor="middle">happens for you</text>

  <circle class="node-ring" cx="790" cy="94" r="10"></circle>
  <text class="stage-num" x="790" y="136" text-anchor="middle">04</text>
  <text class="stage-name" x="790" y="62" text-anchor="middle">One-pedal</text>
  <text class="stage-note" x="790" y="153" text-anchor="middle">still don't know how —</text>
  <text class="stage-note" x="790" y="169" text-anchor="middle">and that's fine</text>

  <line x1="60" y1="345" x2="840" y2="345" stroke="var(--line)" stroke-width="1"></line>
  <text class="tie-back" x="450" y="374" text-anchor="middle">Sessions 1–2 are <tspan class="hi">the manual gearbox</tspan>. Everything after is driven better because you did them.</text>
</svg>
